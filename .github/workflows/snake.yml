name: Generate QA GitHub Snake

on:
  # Automatically update every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual execution from Actions
  workflow_dispatch:

  # Regenerate whenever the main branch changes
  push:
    branches:
      - main


jobs:
  generate:

    # Required to publish the generated SVG to the output branch
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 5


    steps:

      # ============================================================
      # Generate GitHub Contribution Snake
      # ============================================================

      - name: Generate QA Contribution Snake

        uses: Platane/snk/svg-only@v3

        with:

          # GitHub profile username
          github_user_name: lifeofthecoders

          # Generate a clean light version
          # and a dark version for the GitHub profile.
          #
          # Custom colors are supported by snk v3.
          outputs: |

            dist/github-contribution-grid-snake.svg?color_snake=#0969DA&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

            dist/github-contribution-grid-snake-dark.svg?color_snake=#58A6FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353


      # ============================================================
      # Publish generated Snake files
      # ============================================================

      - name: Publish Snake Animation

        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:

          # Publish generated SVG files here
          target_branch: output

          # Directory containing generated files
          build_dir: dist

        env:

          # GitHub automatically provides this token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
